<svg xmlns="http://www.w3.org/2000/svg" width="374" height="345" viewBox="0 0 374 345" role="img" aria-labelledby="title desc">
  <title id="title">Find E4 on a guitar fretboard</title>
  <desc id="desc">On the three highest strings in standard tuning, E4 can be played on the open high E string, on fret five of the B string, or on fret nine of the G string.</desc>
  <defs>
    <pattern id="phosphor" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".46" fill="#83cc96" opacity=".16"/></pattern>
    <clipPath id="draft"><rect class="draft" width="0" height="46"/></clipPath>
    <clipPath id="result"><rect class="result" width="250.43" height="46"/></clipPath>
    <style>
      text { font-family:ui-monospace,Menlo,Consolas,monospace }
      .legend { fill:#a8c8b4;font-size:12px;letter-spacing:1px }
      .number { fill:#a1c6b1;font-size:13px;text-anchor:middle }
      .guess { fill:#c1d3bd }
      .answer { fill:#b7ffc2 }
      .draft { --line:203.48px }
      .result { --line:250.43px }

    </style>
  </defs>
  <rect x=".5" y=".5" width="373" height="344" rx="10" fill="#07140f" stroke="#315b42"/>
  <rect x="1" y="1" width="372" height="343" rx="10" fill="url(#phosphor)"/>
  <text x="18" y="42" fill="#ebf4e7" font-size="24" font-weight="bold">E4</text>
  <text x="71" y="41" fill="#94b09b" font-size="15">/ pitch lookup</text>
  <text x="18" y="66" class="legend">STANDARD TUNING · FRETS 0–9</text>
  <g transform="translate(18 99)">
    <text y="24" fill="#6aef9e" font-size="26">&gt;</text>
    <g transform="translate(26.61 0)">
      <text class="guess" y="24" font-size="26" textLength="203.48" lengthAdjust="spacingAndGlyphs" clip-path="url(#draft)">One position?</text>
      <text class="answer" y="24" font-size="26" textLength="250.43" lengthAdjust="spacingAndGlyphs" clip-path="url(#result)">Three positions.</text>
    </g>
  </g>
<path d="M18 150H356" stroke="#2c4e3c"/>
  <g stroke="#31523d" stroke-width="1">
    <path d="M103.89 192v74"/>
    <path d="M134.78 192v74"/>
    <path d="M165.67 192v74"/>
    <path d="M196.56 192v74"/>
    <path d="M227.44 192v74"/>
    <path d="M258.33 192v74"/>
    <path d="M289.22 192v74"/>
    <path d="M320.11 192v74"/>
    <path d="M351.00 192v74"/>
  </g><path stroke="#85a78e" stroke-width="2.5" d="M73 192v74"/>
  <text x="32" y="204" fill="#c4ddc7" font-size="16">e</text>
  <path d="M73 200h278.00" stroke="#73967c" stroke-width="1.0"/>
  <text x="32" y="233" fill="#c4ddc7" font-size="16">B</text>
  <path d="M73 229h278.00" stroke="#73967c" stroke-width="1.25"/>
  <text x="32" y="262" fill="#c4ddc7" font-size="16">G</text>
  <path d="M73 258h278.00" stroke="#73967c" stroke-width="1.5"/>
  <text class="number" x="61.00" y="181">0</text>
  <text class="number" x="150.22" y="181">3</text>
  <text class="number" x="212.00" y="181">5</text>
  <text class="number" x="273.78" y="181">7</text>
  <text class="number" x="335.56" y="181">9</text>
  <g class="positions">
    <circle cx="61.00" cy="200" r="9" fill="#0a2518" stroke="#69d994" stroke-width="1.2"/>
    <circle cx="61.00" cy="200" r="4" fill="#bbffca"/>
    <circle cx="212.00" cy="229" r="9" fill="#0a2518" stroke="#69d994" stroke-width="1.2"/>
    <circle cx="212.00" cy="229" r="4" fill="#bbffca"/>
    <circle cx="335.56" cy="258" r="9" fill="#0a2518" stroke="#69d994" stroke-width="1.2"/>
