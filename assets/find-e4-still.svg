<svg xmlns="http://www.w3.org/2000/svg" width="840" height="228" viewBox="0 0 840 228" role="img" aria-labelledby="title desc">
  <title id="title">Find E4 on a guitar fretboard</title>
  <desc id="desc">On the three highest strings in standard tuning, E4 can be played on the open high E string, on fret five of the B string, or on fret nine of the G string.</desc>
  <defs>
    <pattern id="phosphor" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".46" fill="#83cc96" opacity=".16"/></pattern>
    <clipPath id="draft"><rect class="draft" width="0" height="46"/></clipPath>
    <clipPath id="result"><rect class="result" width="279.33" height="46"/></clipPath>
    <style>
      text { font-family:ui-monospace,Menlo,Consolas,monospace }
      .legend { fill:#a8c8b4;font-size:13px;letter-spacing:1px }
      .number { fill:#a1c6b1;font-size:14px;text-anchor:middle }
      .guess { fill:#c1d3bd }
      .answer { fill:#b7ffc2 }
      .draft { --line:226.95px }
      .result { --line:279.33px }

    </style>
  </defs>
  <rect x=".5" y=".5" width="839" height="227" rx="10" fill="#07140f" stroke="#315b42"/>
  <rect x="1" y="1" width="838" height="226" rx="10" fill="url(#phosphor)"/>
  <text x="28" y="52" fill="#ebf4e7" font-size="29" font-weight="bold">E4</text>
  <text x="81" y="51" fill="#94b09b" font-size="17">/ pitch lookup</text>
  <text x="28" y="81" class="legend">STANDARD TUNING · FRETS 0–9</text>
  <g transform="translate(28 142)">
    <text y="24" fill="#6aef9e" font-size="29">&gt;</text>
    <g transform="translate(29.68 0)">
      <text class="guess" y="24" font-size="29" textLength="226.95" lengthAdjust="spacingAndGlyphs" clip-path="url(#draft)">One position?</text>
      <text class="answer" y="24" font-size="29" textLength="279.33" lengthAdjust="spacingAndGlyphs" clip-path="url(#result)">Three positions.</text>
    </g>
  </g>
<path d="M372 26V202" stroke="#2c4e3c"/>
  <g stroke="#31523d" stroke-width="1">
    <path d="M487.67 61v86"/>
